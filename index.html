<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PassLoop 纯前端题库管理与刷题工具" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PassLoop</title>
    <style>
      .no-js-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #eef4f1;
        color: #17231f;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .no-js-card {
        width: min(100%, 520px);
        padding: 24px;
        border: 1px solid #d8e1dc;
        border-radius: 8px;
        background: #fbfdfb;
        box-shadow: 0 16px 40px rgba(22, 46, 38, 0.09);
      }

      .no-js-card h1 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .no-js-card p {
        margin: 0;
        color: #63726d;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="no-js-fallback">
        <section class="no-js-card" aria-label="PassLoop requires JavaScript">
          <h1>PassLoop 需要启用 JavaScript</h1>
          <p>
            PassLoop 是纯前端刷题工具，题库管理、练习记录和本地存储都依赖浏览器脚本。
            请启用 JavaScript 后刷新页面继续使用。
          </p>
        </section>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
