name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:single

      - name: Rename output
        run: mv dist-single/index.html passloop.html

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: passloop.html
