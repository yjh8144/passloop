name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:single

      - name: Prepare release assets
        run: |
          mv dist-single/index.html passloop.html
          sha256sum passloop.html | awk '{print $1}' > passloop.html.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            passloop.html
            passloop.html.sha256
          generate_release_notes: true
